spring:
  application:
    name: watchlist-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    com.jiostar.watchlist: INFO
    org.springframework.web.servlet.DispatcherServlet: WARN

watchlist:
  max-size: 500
  max-page-size: 50
  allowed-user-ids: 1, 2, 3, 4
