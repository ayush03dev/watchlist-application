services:
  postgres:
    image: postgres:16-alpine
    container_name: watchlist-pg
    environment:
      POSTGRES_DB: watchlist
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d watchlist"]
      interval: 5s
      timeout: 5s
      retries: 5
